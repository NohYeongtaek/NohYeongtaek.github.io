<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Family Archive</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; padding: 0 20px; color: #fff;
    background: radial-gradient(ellipse at 50% 100%, #262626 0%, #000 70%) #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .card { width: 100%; max-width: 380px; padding: 32px 0; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { margin: 0 0 16px; line-height: 1.5; color: #bbb; font-size: 15px; }
  .btn {
    display: block; margin: 24px 0 14px; padding: 16px; border-radius: 999px;
    background: #fff; color: #000; font-size: 17px; font-weight: 600; text-decoration: none;
  }
  .sub { display: inline-block; color: #fff; font-size: 15px; margin-bottom: 24px; }
  .note { font-size: 13px; color: #888; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title"></h1>
  <p id="desc"></p>
  <div id="ok">
    <a class="btn" id="open"></a>
    <a class="sub" id="store" href="https://apps.apple.com/app/id6827439478"></a>
    <p class="note" id="hint"></p>
    <p class="note" id="kakao" hidden></p>
  </div>
</div>
<script>
var L = {
  ko: { title: "가족으로 초대받았어요", desc: "Family Archive에서 가족의 사진과 영상을 함께 모아요", open: "앱에서 열기", store: "App Store에서 받기", hint: "앱을 처음 설치했다면, 초대 메시지에 있는 초대 코드를 앱의 프로필 → 초대 코드 입력에 넣어 주세요.", kakao: "카카오톡 안에서 열리지 않으면 오른쪽 아래 ⋯ → 다른 브라우저로 열기를 눌러 주세요.", bad: "초대 링크가 올바르지 않아요" },
  en: { title: "You're invited to join a family", desc: "Collect your family's photos and videos together in Family Archive", open: "Open in app", store: "Get it on the App Store", hint: "If you just installed the app, enter the invite code from the invitation message under Profile → Enter invite code.", kakao: "If it doesn't open in KakaoTalk, tap ⋯ at the bottom right → Open in other browser.", bad: "This invite link isn't valid" },
  ja: { title: "家族に招待されました", desc: "Family Archiveで家族の写真や動画をみんなで集めましょう", open: "アプリで開く", store: "App Storeで入手", hint: "アプリを初めてインストールした場合は、招待メッセージにある招待コードを、アプリのプロフィール → 招待コード入力に入力してください。", kakao: "KakaoTalk内で開けない場合は、右下の ⋯ → 他のブラウザで開く をタップしてください。", bad: "招待リンクが正しくありません" },
  zh: { title: "你被邀请加入家庭", desc: "在 Family Archive 中一起收集家人的照片和视频", open: "在应用中打开", store: "在 App Store 下载", hint: "如果你刚安装了应用，请将邀请信息中的邀请码输入到应用的“个人资料 → 输入邀请码”中。", kakao: "如果在 KakaoTalk 中无法打开，请点击右下角的 ⋯ → 在其他浏览器中打开。", bad: "邀请链接无效" },
  es: { title: "Te han invitado a una familia", desc: "Reúne las fotos y los vídeos de tu familia en Family Archive", open: "Abrir en la app", store: "Descargar en App Store", hint: "Si acabas de instalar la app, introduce el código de invitación del mensaje en Perfil → Introducir código de invitación.", kakao: "Si no se abre en KakaoTalk, toca ⋯ abajo a la derecha → Abrir en otro navegador.", bad: "El enlace de invitación no es válido" },
  pt: { title: "Você foi convidado para uma família", desc: "Reúna as fotos e os vídeos da sua família no Family Archive", open: "Abrir no app", store: "Baixar na App Store", hint: "Se você acabou de instalar o app, digite o código de convite da mensagem em Perfil → Inserir código de convite.", kakao: "Se não abrir no KakaoTalk, toque em ⋯ no canto inferior direito → Abrir em outro navegador.", bad: "O link de convite não é válido" },
  de: { title: "Du wurdest in eine Familie eingeladen", desc: "Sammelt die Fotos und Videos eurer Familie gemeinsam in Family Archive", open: "In der App öffnen", store: "Im App Store laden", hint: "Wenn du die App gerade erst installiert hast, gib den Einladungscode aus der Nachricht unter Profil → Einladungscode eingeben ein.", kakao: "Falls es in KakaoTalk nicht öffnet, tippe unten rechts auf ⋯ → In anderem Browser öffnen.", bad: "Dieser Einladungslink ist ungültig" },
  fr: { title: "Vous êtes invité à rejoindre une famille", desc: "Réunissez les photos et vidéos de votre famille dans Family Archive", open: "Ouvrir dans l'app", store: "Télécharger sur l'App Store", hint: "Si vous venez d'installer l'app, saisissez le code d'invitation du message dans Profil → Saisir un code d'invitation.", kakao: "Si le lien ne s'ouvre pas dans KakaoTalk, touchez ⋯ en bas à droite → Ouvrir dans un autre navigateur.", bad: "Ce lien d'invitation n'est pas valide" }
};
var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
var T = L[lang] || L.en;
document.documentElement.lang = L[lang] ? lang : "en";
function $(id) { return document.getElementById(id); }
var t = new URLSearchParams(location.search).get("t") || "";
$("title").textContent = T.title;
if (!/^[0-9a-f-]{36}$/i.test(t)) {
  $("desc").textContent = T.bad;
  $("ok").hidden = true;
} else {
  var url = "familyarchive://invite/" + t;
  $("desc").textContent = T.desc;
  $("open").textContent = T.open;
  $("open").href = url;
  $("store").textContent = T.store;
  $("hint").textContent = T.hint;
  if (/KAKAOTALK/i.test(navigator.userAgent)) { $("kakao").textContent = T.kakao; $("kakao").hidden = false; }
  location.href = url;
}
</script>
</body>
</html>
